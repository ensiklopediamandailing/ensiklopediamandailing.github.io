name: Validate encyclopedia content

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate content
        run: python3 scripts/prepare-content.py
      - name: Check generated content is committed
        run: |
          git diff --exit-code -- data/content.js index.html
      - name: Run integrity and accessibility baseline checks
        run: node scripts/check.mjs
