<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 system-ui;margin:0;background:#faf7f0;color:#302824}main{max-width:650px;margin:auto;padding:24px}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;padding:10px;box-sizing:border-box}textarea{min-height:130px}button{background:#641e2b;color:white;border:0;padding:12px 18px}small{color:#6d625b}</style></head><body><main><h1>Kirim usulan Ensiklopedia Mandailing</h1><p>Usulan disimpan di antrean privat Google Drive dan diperiksa admin sebelum diterbitkan. Jangan masukkan informasi pribadi sensitif atau materi tanpa izin.</p><form id="f"><label>Jenis<select name="kind"><option>Artikel baru</option><option>Koreksi</option><option>Sumber tertulis</option><option>Dokumentasi berizin</option><option>Bahasa dan istilah</option></select></label><label>Topik<input name="topic" minlength="3" maxlength="180" required></label><label>Wilayah umum<input name="region" maxlength="150"></label><label>Usulan<textarea name="text" minlength="20" maxlength="8000" required></textarea></label><label>Sumber<textarea name="source" maxlength="2000"></textarea></label><label>Nama atribusi (opsional)<input name="credit" maxlength="120"></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px"><label><input type="checkbox" name="consent" required style="width:auto;display:inline"> Saya memiliki izin yang diperlukan dan tidak memasukkan informasi sensitif.</label><button type="submit">Kirim ke antrean moderasi</button></form><p id="status" role="status"></p><small>Admin dapat menerima atau menolak usulan. Pengiriman tidak memberikan hak edit website.</small></main><script>document.querySelector('#f').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f).entries());o.consent=f.elements.consent.checked;document.querySelector('#status').textContent='Mengirim…';google.script.run.withSuccessHandler(r=>{document.querySelector('#status').textContent=r.message+' ID: '+r.id;f.reset()}).withFailureHandler(()=>{document.querySelector('#status').textContent='Pengiriman gagal. Silakan coba kembali.'}).submitProposal(o)});</script></body></html>
