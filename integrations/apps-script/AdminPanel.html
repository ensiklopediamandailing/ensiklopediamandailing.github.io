<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px/1.5 system-ui;margin:30px;background:#faf7f0}article{border:1px solid #bbb;padding:16px;margin:15px 0;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:5px;padding:8px}small{color:#555}</style></head><body><h1>Panel Moderasi — Admin</h1><p>Hanya akun admin terdaftar. Menyetujui usulan mengubah status peninjauan, <strong>tidak otomatis menerbitkan artikel</strong>.</p><button onclick="load()">Muat ulang antrean</button><p id="status" role="status"></p><section id="items"></section><script>const items=document.querySelector('#items'),status=document.querySelector('#status');function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}function load(){status.textContent='Memuat…';google.script.run.withSuccessHandler(rows=>{items.replaceChildren();status.textContent=rows.length+' usulan ditemukan';rows.forEach(r=>{const a=el('article','');a.append(el('h2',r.topic),el('small',r.receivedAt+' · '+r.kind+' · '+r.status),el('pre',r.text),el('p','Sumber: '+(r.source||'Tidak ada')),el('p','Konteks: '+(r.region||'Tidak ada')));['reviewing','approved','rejected'].forEach(value=>{const b=el('button',value);b.addEventListener('click',()=>{b.disabled=true;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(e=>{b.disabled=false;status.textContent=e.message}).moderateProposal(r.fileId,value)});a.append(b)});items.append(a)})}).withFailureHandler(e=>status.textContent='Akses gagal: '+e.message).listProposals()}load();</script></body></html>
